name: Dependency Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-refresh-${{ github.ref }}
  cancel-in-progress: false

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  KOTLIN_CLI_BOOTSTRAP_CACHE_DIR: ${{ github.workspace }}/.kotlin-cli-cache

jobs:
  refresh_gemfile_lock:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: android-actions/setup-android@v4

      - name: Update Bundler lockfile
        run: bundle update fastlane
        env:
          BUNDLE_FROZEN: "false"
          BUNDLE_DEPLOYMENT: "false"

      - name: Smoke test portable Android debug job
        run: ./scripts/ci/run_job.sh android-build-debug

      - name: Reset installed gems and local Bundler config
        run: |
          git restore .bundle/config vendor/bundle || true

      - name: Detect Gemfile changes
        id: gem_changes
        run: |
          if git diff --quiet -- Gemfile.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Gemfile refresh PR
        if: steps.gem_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/dependency-refresh-bundler
          delete-branch: true
          add-paths: |
            Gemfile.lock
          commit-message: "chore(deps): refresh Gemfile.lock"
          title: "chore(deps): refresh Gemfile.lock"
          body: |
            Automated weekly Bundler refresh.

            Changes in this PR:
            - updates `Gemfile.lock` via `bundle update fastlane`
            - runs the portable Android debug smoke job
          labels: |
            dependencies
            ruby

  refresh_kotlin_toolchain_template:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: android-actions/setup-android@v4

      - name: Regenerate Kotlin Toolchain app layer
        run: ./scripts/regenerate_from_kotlin_toolchain.sh

      - name: Smoke test portable Android debug job
        run: ./scripts/ci/run_job.sh android-build-debug

      - name: Detect regenerated changes
        id: kotlin_toolchain_changes
        run: |
          if git diff --quiet -- \
            kotlin \
            kotlin.bat \
            project.yaml \
            android-app \
            ios-app \
            shared; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Kotlin Toolchain refresh PR
        if: steps.kotlin_toolchain_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/dependency-refresh-kotlin-toolchain
          delete-branch: true
          commit-message: "chore(kotlin-toolchain): refresh generated app layer"
          title: "chore(kotlin-toolchain): refresh generated app layer"
          body: |
            Automated weekly Kotlin Toolchain regeneration.

            Changes in this PR:
            - reruns `./scripts/regenerate_from_kotlin_toolchain.sh`
            - captures template and generated dependency drift
            - runs the portable Android debug smoke job
          labels: |
            dependencies
            kotlin-toolchain
