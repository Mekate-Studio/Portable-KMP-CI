name: Mobile CI (Self-hosted)

on:
  workflow_dispatch:
    inputs:
      release_target:
        description: "Manual release flow to run"
        required: true
        default: none
        type: choice
        options:
          - none
          - publishInternal
          - promoteAlpha
          - promoteBeta
          - promoteProduction
          - iosArchiveRelease
          - iosTestFlight

permissions:
  contents: read

concurrency:
  group: mobile-ci-self-hosted-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  AMPER_BOOTSTRAP_CACHE_DIR: ${{ github.workspace }}/.amper-cache

jobs:
  android_build_debug:
    runs-on: [self-hosted, macOS, ARM64, kmp-sample]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Build Android debug
        run: ./scripts/ci/run_job.sh android-build-debug

  android_build_release:
    runs-on: [self-hosted, macOS, ARM64, kmp-sample]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Build Android release
        run: ./scripts/ci/run_job.sh android-build-release
      - name: Upload Android artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: android-release-build
          path: build

  android_test:
    runs-on: [self-hosted, macOS, ARM64, kmp-sample]
    needs:
      - android_build_debug
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Run Android tests
        run: ./scripts/ci/run_job.sh android-test

  ios_build_debug:
    runs-on: [self-hosted, macOS, ARM64, kmp-sample]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build iOS debug
        run: ./scripts/ci/run_job.sh ios-build-debug

  ios_build_release:
    runs-on: [self-hosted, macOS, ARM64, kmp-sample]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build iOS release
        run: ./scripts/ci/run_job.sh ios-build-release

  ios_archive_release:
    if: contains(fromJson('["iosArchiveRelease","iosTestFlight"]'), github.event.inputs.release_target) && github.ref_name == github.event.repository.default_branch
    needs:
      - ios_build_release
    runs-on: [self-hosted, macOS, ARM64, kmp-sample]
    environment: ios-release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Archive iOS release
        run: ./scripts/ci/run_job.sh ios-archive-release
      - name: Upload iOS archive
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ios-archive
          path: build/ios

  ios_testflight:
    if: github.event.inputs.release_target == 'iosTestFlight' && github.ref_name == github.event.repository.default_branch
    needs:
      - ios_archive_release
    runs-on: [self-hosted, macOS, ARM64, kmp-sample]
    environment: testflight
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download iOS archive
        uses: actions/download-artifact@v8
        with:
          name: ios-archive
          path: build/ios
      - name: Upload to TestFlight
        run: ./scripts/ci/run_job.sh ios-testflight

  publish_internal:
    if: github.event.inputs.release_target == 'publishInternal'
    needs:
      - android_build_release
    runs-on: [self-hosted, macOS, ARM64, kmp-sample]
    environment: play-internal
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Download Android release build
        uses: actions/download-artifact@v8
        with:
          name: android-release-build
          path: build
      - name: Publish internal track
        run: ./scripts/ci/run_job.sh publish-internal

  promote_alpha:
    if: github.event.inputs.release_target == 'promoteAlpha'
    runs-on: [self-hosted, macOS, ARM64, kmp-sample]
    environment: play-alpha
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Promote internal to alpha
        run: ./scripts/ci/run_job.sh promote-alpha

  promote_beta:
    if: github.event.inputs.release_target == 'promoteBeta'
    runs-on: [self-hosted, macOS, ARM64, kmp-sample]
    environment: play-beta
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Promote alpha to beta
        run: ./scripts/ci/run_job.sh promote-beta

  promote_production:
    if: github.event.inputs.release_target == 'promoteProduction' && github.ref_name == github.event.repository.default_branch
    runs-on: [self-hosted, macOS, ARM64, kmp-sample]
    environment: play-production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Promote beta to production
        run: ./scripts/ci/run_job.sh promote-production
