<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">What changed from the raw Kotlin Toolchain template</title>
  <desc id="desc">An editorial comparison between the generated Kotlin Toolchain scaffold and the final portable CI sample.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 42px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .sub { font: 500 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #475569; }
      .cardTitle { font: 700 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .item { font: 500 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1e293b; }
      .muted { font: 500 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #64748b; }
      .centerLabel { font: 700 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1200" height="820" fill="#f8fafc"/>
  <text x="70" y="82" class="title">What changed from the raw Kotlin Toolchain template?</text>
  <text x="70" y="118" class="sub">The sample starts from `kotlin init compose-multiplatform` and then trims and overlays only what the CI pattern needs.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="178" width="430" height="540" rx="28" fill="#ffffff"/>
    <rect x="700" y="178" width="430" height="540" rx="28" fill="#ffffff"/>
  </g>

  <rect x="96" y="204" width="108" height="30" rx="15" fill="#dbeafe"/>
  <text x="150" y="224" text-anchor="middle" class="item">Generated</text>
  <text x="110" y="278" class="cardTitle">Raw Kotlin Toolchain scaffold</text>
  <text x="110" y="336" class="item">+ android-app/</text>
  <text x="110" y="382" class="item">+ ios-app/</text>
  <text x="110" y="428" class="item">+ shared/</text>
  <text x="110" y="474" class="item">+ jvm-app/</text>
  <text x="110" y="520" class="item">+ project.yaml</text>
  <text x="110" y="566" class="item">+ kotlin wrappers</text>
  <text x="110" y="640" class="muted">Good starting point,</text>
  <text x="110" y="672" class="muted">but not yet a reusable CI sample.</text>

  <rect x="726" y="204" width="106" height="30" rx="15" fill="#dcfce7"/>
  <text x="779" y="224" text-anchor="middle" class="item">Published</text>
  <text x="740" y="278" class="cardTitle">Portable KMP CI Sample</text>
  <text x="740" y="336" class="item">- remove jvm-app and JVM shared</text>
  <text x="762" y="366" class="item">sources/tests</text>
  <text x="740" y="414" class="item">+ lock modules to android-app,</text>
  <text x="762" y="444" class="item">ios-app, and shared</text>
  <text x="740" y="492" class="item">+ add Android namespace, appId,</text>
  <text x="762" y="522" class="item">SDK levels, and versions</text>
  <text x="740" y="570" class="item">+ add GitHub Actions workflow</text>
  <text x="740" y="616" class="item">+ add Fastlane + scripts/ci/ overlay</text>
  <text x="740" y="662" class="item">+ add support files and</text>
  <text x="762" y="692" class="item">self-regeneration script</text>

  <path d="M520 450 C585 450, 615 450, 680 450" stroke="#16a34a" stroke-width="8" stroke-linecap="round" fill="none"/>
  <polygon points="690,450 666,436 666,464" fill="#16a34a"/>
  <text x="600" y="414" text-anchor="middle" class="centerLabel">trim + overlay</text>
</svg>
