<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Portable KMP CI architecture</title>
  <desc id="desc">An editorial diagram showing CI orchestration flowing through repo scripts, Fastlane, and Kotlin Toolchain.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .heroTitle { font: 700 50px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #fff; }
      .heroBody { font: 500 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #dcfce7; }
      .eyebrow { font: 700 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #bbf7d0; letter-spacing: 0.14em; text-transform: uppercase; }
      .sectionTitle { font: 700 27px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .sectionBody { font: 500 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #334155; }
      .badge { font: 700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .label { font: 600 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #475569; }
      .footer { font: 500 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc"/>
  <rect x="44" y="38" width="1112" height="180" rx="30" fill="url(#hero)"/>
  <text x="82" y="88" class="eyebrow">Portable architecture</text>
  <text x="82" y="142" class="heroTitle">Keep CI adapters thin.</text>
  <text x="82" y="194" class="heroBody">Put job meaning in the repository, not in the YAML.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="276" width="230" height="286" rx="26" fill="#ffffff"/>
    <rect x="334" y="276" width="230" height="286" rx="26" fill="#ffffff"/>
    <rect x="604" y="276" width="230" height="286" rx="26" fill="#ffffff"/>
    <rect x="874" y="276" width="262" height="286" rx="26" fill="#ffffff"/>
  </g>

  <rect x="88" y="300" width="84" height="30" rx="15" fill="#dbeafe"/>
  <text x="130" y="320" text-anchor="middle" class="badge">Step 1</text>
  <text x="88" y="370" class="sectionTitle">GitHub Actions</text>
  <text x="88" y="414" class="sectionBody">Triggers</text>
  <text x="88" y="446" class="sectionBody">Runners</text>
  <text x="88" y="478" class="sectionBody">Artifacts</text>
  <text x="88" y="528" class="label">Orchestration only</text>

  <rect x="358" y="300" width="84" height="30" rx="15" fill="#dcfce7"/>
  <text x="400" y="320" text-anchor="middle" class="badge">Step 2</text>
  <text x="358" y="370" class="sectionTitle">Repo Scripts</text>
  <text x="358" y="414" class="sectionBody">Portable job names</text>
  <text x="358" y="446" class="sectionBody">Environment prep</text>
  <text x="358" y="478" class="sectionBody">Secrets materialization</text>
  <text x="358" y="528" class="label">Job contract lives here</text>

  <rect x="628" y="300" width="84" height="30" rx="15" fill="#fef3c7"/>
  <text x="670" y="320" text-anchor="middle" class="badge">Step 3</text>
  <text x="628" y="370" class="sectionTitle">Fastlane</text>
  <text x="628" y="414" class="sectionBody">Build commands</text>
  <text x="628" y="446" class="sectionBody">Release lanes</text>
  <text x="628" y="478" class="sectionBody">Store upload steps</text>
  <text x="628" y="528" class="label">Command layer</text>

  <rect x="898" y="300" width="84" height="30" rx="15" fill="#fee2e2"/>
  <text x="940" y="320" text-anchor="middle" class="badge">Step 4</text>
  <text x="898" y="370" class="sectionTitle">Kotlin Toolchain + Project</text>
  <text x="898" y="414" class="sectionBody">Android app</text>
  <text x="898" y="446" class="sectionBody">iOS app</text>
  <text x="898" y="478" class="sectionBody">Shared Kotlin code</text>
  <text x="898" y="528" class="label">Actual build system</text>

  <path d="M294 420 L334 420" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
  <path d="M564 420 L604 420" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
  <path d="M834 420 L874 420" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
  <polygon points="334,420 316,408 316,432" fill="#94a3b8"/>
  <polygon points="604,420 586,408 586,432" fill="#94a3b8"/>
  <polygon points="874,420 856,408 856,432" fill="#94a3b8"/>

  <text x="600" y="660" text-anchor="middle" class="footer">Local reproduction, thinner YAML, and easier migration all come from separating orchestration from implementation.</text>
</svg>
